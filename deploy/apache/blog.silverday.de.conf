# Cuniform vhost for blog.silverday.de (SPEC §3.2, §15.1) — T27.
#
# Install: symlink (or copy) this file into Apache's sites-available/, then
# `a2ensite blog.silverday.de` (or the distro equivalent) and reload. Requires
# mod_rewrite, mod_headers, mod_alias, mod_proxy_fcgi, mod_ssl (SPEC §15.1).
#
# Certificates: managed by certbot/ACME (SPEC §15.5's "ACME renewal succeeds
# across a deploy" — T27's own acceptance criterion). This file deliberately
# does not hardcode SSLCertificateFile/SSLCertificateKeyFile paths — running
# `certbot --apache -d blog.silverday.de` against the port-80 vhost below
# inserts them itself, and `certbot renew` keeps them current without ever
# touching the routing directives here.
#
# The port-80 vhost exists for exactly one reason: Let's Encrypt's HTTP-01
# challenge validates over plain HTTP. SPEC §3.2's own skeleton shows only
# the port-443 vhost — this port-80 half is this file's own addition, not a
# literal transcription of that block, because "ACME renewal succeeds" isn't
# achievable via the standard HTTP-01 method without it. It carries nothing
# but the challenge alias and a redirect; everything else lives on :443.
<VirtualHost *:80>
    ServerName blog.silverday.de

    Alias /.well-known/acme-challenge/ /srv/vhosts/blog.silverday.de/acme/
    <Directory /srv/vhosts/blog.silverday.de/acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RedirectMatch 301 ^(?!/\.well-known/acme-challenge/)(.*)$ https://blog.silverday.de$1
</VirtualHost>

<VirtualHost *:443>
    ServerName blog.silverday.de
    DocumentRoot /srv/vhosts/blog.silverday.de/public

    # ACME webroot must NOT live inside the swapped tree (SPEC §3.3) — a
    # build landing during the validation window would swap the challenge
    # file away, a failure that only surfaces 60 days later as an expired
    # certificate rather than at deploy time.
    Alias /.well-known/acme-challenge/ /srv/vhosts/blog.silverday.de/acme/
    <Directory /srv/vhosts/blog.silverday.de/acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    # Declare both the symlink path and its target (SPEC §3.2's own caveat):
    # Apache follows symlinks only when the *relevant* directory's Options
    # permit it, and which path counts as "relevant" when DocumentRoot itself
    # is a symlink is not worth taking on faith. Verify once after the first
    # swap — request a page, confirm 200.
    <Directory /srv/vhosts/blog.silverday.de/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        <FilesMatch "\.(php|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>
    <Directory /srv/vhosts/blog.silverday.de/releases>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        <FilesMatch "\.(php|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Root holds no content (SPEC §7.4.1) — 302, not 301: a permanent
    # redirect on the site root is cached by browsers effectively forever,
    # and this is the one place the symmetric URL scheme's flexibility
    # (changing default_language later) is actually realized.
    RedirectMatch 302 ^/$ /en/

    # Neutral 404 for non-prefixed paths, per-language inside each prefix
    # (SPEC §7.12) — T27's other acceptance criterion: the per-language 404
    # fires inside each prefix, the neutral one fires outside them. Both
    # routes already exist in every build's output (T17); this is what ties
    # Apache's error handling to them.
    ErrorDocument 404 /404.html
    <Location "/de/">
        ErrorDocument 404 /de/404.html
    </Location>
    <Location "/en/">
        ErrorDocument 404 /en/404.html
    </Location>

    Alias /admin /srv/vhosts/blog.silverday.de/admin
    <Directory /srv/vhosts/blog.silverday.de/admin>
        Options None
        AllowOverride None
        Require all granted
        <FilesMatch "\.php$">
            SetHandler "proxy:unix:/run/php/cuniform-admin.sock|fcgi://localhost"
        </FilesMatch>
    </Directory>

    # SPEC §14.1 — CSP is the primary control here, not defence in depth
    # (admin and site share an origin, §3.4). script-src carries no
    # 'sha256-...' hash and no 'unsafe-inline': every template (T17) ships
    # zero inline scripts — search.php's own script is an external file
    # (search.<hash>.js) specifically so this line never needs one.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'; object-src 'none'"

    # SPEC §14.2 — response headers site-wide.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set X-Frame-Options "DENY"

    # SPEC §11.4 — immutable for fingerprinted assets, short-lived + revalidated for HTML.
    <FilesMatch "\.[0-9a-f]{8}\.(css|js)$">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch "\.html$">
        Header always set Cache-Control "public, max-age=600, must-revalidate"
    </FilesMatch>

    ErrorLog /srv/vhosts/blog.silverday.de/logs/error.log
    CustomLog /srv/vhosts/blog.silverday.de/logs/access.log combined
</VirtualHost>
